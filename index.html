<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Created - By Cuervita</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #00f2ff; --bg: #050505; --accent: #ff00ff; 
            --chat-green: #00ff41; --danger: #ff0000; --shadow: rgba(0, 242, 255, 0.5);
        }
        body, html { margin: 0; padding: 0; background-color: var(--bg); color: white; font-family: 'Orbitron', sans-serif; overflow-x: hidden; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: -1; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px 10px; min-height: 100vh; }
        .nav-menu { margin-bottom: 25px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 1000; }
        button {
            background: rgba(0,0,0,0.5); border: 1.5px solid var(--primary); color: var(--primary);
            padding: 10px 15px; cursor: pointer; text-transform: uppercase; font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem; transition: 0.3s;
        }
        button:hover { background: var(--primary); color: black; box-shadow: 0 0 15px var(--primary); }
        .panel {
            background: rgba(0, 0, 0, 0.98); padding: 25px; border: 1px solid var(--primary);
            box-shadow: 0 0 15px var(--shadow); width: 95%; max-width: 450px; text-align: center; margin-bottom: 20px;
        }
        .date-selects { display: flex; gap: 5px; justify-content: center; margin: 15px 0; }
        select { background: #111; color: #fff; border: 1px solid var(--primary); padding: 10px; font-family: 'Orbitron'; font-size: 0.8rem; }
        #chat-display { height: 350px; border: 1px solid var(--primary); margin: 10px 0; padding: 10px; overflow-y: auto; background: #000; display: flex; flex-direction: column; }
        .msg { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 12px; }
        .msg img.pfp { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--primary); object-fit: cover; }
        .msg-txt { background: rgba(255,255,255,0.1); padding: 8px; border-radius: 8px; font-size: 0.75rem; text-align: left; word-break: break-word; }
        .chat-img { max-width: 100%; border-radius: 5px; margin-top: 5px; border: 1px solid var(--primary); }
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 20px; width: 100%; max-width: 800px; }
        .video-card { background: #000; border: 1px solid var(--primary); position: relative; width: 100%; }
        video { width: 100% !important; height: auto !important; display: block; }
        input[type="text"], input[type="password"] {
            background: #111; color: #fff; border: 1px solid var(--primary); padding: 10px; margin: 5px; width: 80%; font-family: 'Orbitron';
        }
        .hidden { display: none !important; }
        body.owner-mode { --primary: var(--accent); }
        body.chat-mode { --primary: var(--chat-green); }
        body.restricted-mode { --primary: var(--danger); }
    </style>
</head>
<body id="main-body">

    <div id="particles-js"></div>

    <div class="container">
        <h1 style="text-shadow: 0 0 10px var(--primary); font-size: 1.8rem; margin: 10px 0;">ANIMES</h1>
        <div style="margin-bottom: 20px; font-size: 0.9rem;">BY 𓅨𝘾𝙪𝙚𝙧𝙫𝙞𝙩𝙖𓅨</div>

        <div class="nav-menu">
            <button onclick="location.reload()">INICIO</button>
            <button onclick="goSection('login-user')" style="color:var(--chat-green); border-color:var(--chat-green)">CHAT PÚBLICO</button>
            <button onclick="goSection('login-owner')" style="color:var(--accent); border-color:var(--accent)">MODO OWNER</button>
            <button onclick="goSection('age-check')" style="color:var(--danger); border-color:var(--danger)">ANIMES +18</button>
        </div>

        <div id="sec-age" class="panel hidden">
            <h4 style="color:var(--danger)">VERIFICACIÓN DE EDAD</h4>
            <div class="date-selects">
                <select id="birth-day"></select>
                <select id="birth-month">
                    <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
                    <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
                    <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
                    <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
                </select>
                <select id="birth-year"></select>
            </div>
            <button onclick="verifyAge()">ACCEDER</button>
        </div>

        <div id="sec-login" class="panel hidden">
            <h4 id="txt-login">ACCESO</h4>
            <input type="text" id="inp-user" placeholder="USUARIO">
            <input type="password" id="inp-pass" placeholder="PASSWORD">
            <br>
            <button onclick="checkAccess()">ENTRAR</button>
        </div>

        <div id="sec-choice" class="panel hidden">
            <h4>SISTEMA DE CONTROL</h4>
            <div id="choice-btns"></div>
        </div>

        <div id="sec-chat" class="panel hidden">
            <small id="chat-type" style="color:var(--primary); font-weight:bold;"></small>
            <div style="display:flex; align-items:center; gap:10px; margin:10px 0;">
                <img id="my-pfp" src="https://i.imgur.com/8Km9tll.png" style="width:40px; height:40px; border-radius:50%; border:1px solid var(--primary);">
                <input type="text" id="my-name" style="background:transparent; color:#fff; border:none; border-bottom:1px solid var(--primary); width:60%;" onchange="nick=this.value">
            </div>
            <div id="chat-display"></div>
            <div style="display:flex; flex-direction:column; gap:5px;">
                <div style="display:flex; gap:5px;">
                    <input type="text" id="chat-input" placeholder="Escribir...">
                    <button onclick="sendMsg('text')">OK</button>
                </div>
                <div style="display:flex; gap:5px;">
                    <button onclick="document.getElementById('chat-img-up').click()" style="font-size:0.55rem; flex:1">FOTO</button>
                    <button onclick="document.getElementById('file-up').click()" style="font-size:0.55rem; flex:1">PERFIL</button>
                </div>
            </div>
            <input type="file" id="file-up" class="hidden" accept="image/*" onchange="updatePFP(this)">
            <input type="file" id="chat-img-up" class="hidden" accept="image/*" onchange="sendMsg('image', this)">
        </div>

        <div class="video-grid" id="vid-cont"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let nick = ""; let mode = ""; let activeRoom = "";
        const mainVids = ["https://files.catbox.moe/5h90ie.mp4", "https://files.catbox.moe/raj6qu.mp4", "https://qu.ax/24BUB", "https://files.catbox.moe/woz4p2.mp4", "https://qu.ax/KKhtu", "https://files.catbox.moe/ltwwe0.mp4", "https://files.catbox.moe/sm22y2.mp4"];

        particlesJS("particles-js", { "particles": { "number": { "value": 40 }, "color": { "value": "#00f2ff" }, "line_linked": { "enable": true, "color": "#00f2ff" }, "move": { "speed": 1 } } });

        window.onload = () => {
            loadVideos(mainVids);
            const d = document.getElementById('birth-day');
            for(let i=1; i<=31; i++) d.innerHTML += `<option value="${i}">${i}</option>`;
            const y = document.getElementById('birth-year');
            for(let i=2026; i>=1950; i--) y.innerHTML += `<option value="${i}">${i}</option>`;
        };

        function hideAll() {
            document.getElementById('vid-cont').innerHTML = "";
            document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
        }

        function goSection(sec) {
            hideAll();
            if(sec === 'age-check') {
                document.getElementById('sec-age').classList.remove('hidden');
                document.getElementById('main-body').className = "restricted-mode";
            } else if(sec === 'login-user') {
                mode = 'user';
                document.getElementById('sec-login').classList.remove('hidden');
                document.getElementById('main-body').className = "chat-mode";
            } else if(sec === 'login-owner') {
                mode = 'owner';
                document.getElementById('sec-login').classList.remove('hidden');
                document.getElementById('main-body').className = "owner-mode";
            }
        }

        function checkAccess() {
            const u = document.getElementById('inp-user').value;
            const p = document.getElementById('inp-pass').value;
            const b = document.getElementById('choice-btns');
            b.innerHTML = "";
            if (mode === 'owner' && u === "Cuervita" && p === "Reze8890") {
                nick = "𓅨𝘾𝙪𝙚𝙧𝙫𝙞𝙩𝙖𓅨";
                document.getElementById('sec-login').classList.add('hidden');
                document.getElementById('sec-choice').classList.remove('hidden');
                b.innerHTML = '<button onclick="openRoom(\'Publico\')">ENTRAR AL PÚBLICO</button><button onclick="openRoom(\'Directo\')">VER DIRECTOS</button>';
            } else if (mode === 'user' && u === "Usuario" && p === "usuario11") {
                nick = "User_" + Math.floor(Math.random()*999);
                document.getElementById('sec-login').classList.add('hidden');
                document.getElementById('sec-choice').classList.remove('hidden');
                b.innerHTML = '<button onclick="openRoom(\'Publico\')">CHAT PÚBLICO</button><button onclick="openRoom(\'Directo\')">HABLAR CON CUERVITA</button>';
            } else { alert("Error."); }
        }

        function openRoom(r) {
            activeRoom = r;
            document.getElementById('sec-choice').classList.add('hidden');
            document.getElementById('sec-chat').classList.remove('hidden');
            document.getElementById('chat-type').innerText = "CANAL: " + r;
            document.getElementById('my-name').value = nick;
            
            // ESCUCHAR MENSAJES EN TIEMPO REAL DESDE FIREBASE
            db.ref('messages/' + r).on('value', (snapshot) => {
                const display = document.getElementById('chat-display');
                display.innerHTML = "";
                const data = snapshot.val();
                if(data) {
                    Object.values(data).forEach(m => {
                        let content = m.type === 'text' ? m.content : `<img src="${m.content}" class="chat-img">`;
                        display.innerHTML += `<div class="msg"><img src="${m.pfp}" class="pfp"><div class="msg-txt"><b>${m.nick}</b><br>${content}</div></div>`;
                    });
                }
                display.scrollTop = display.scrollHeight;
            });
        }

        function sendMsg(type, input) {
            const pfp = document.getElementById('my-pfp').src;
            if (type === 'text') {
                const val = document.getElementById('chat-input').value;
                if(!val) return;
                db.ref('messages/' + activeRoom).push({
                    nick: nick, pfp: pfp, content: val, type: 'text', time: Date.now()
                });
                document.getElementById('chat-input').value = "";
            } else if (type === 'image' && input.files[0]) {
                const r = new FileReader();
                r.onload = e => {
                    db.ref('messages/' + activeRoom).push({
                        nick: nick, pfp: pfp, content: e.target.result, type: 'image', time: Date.now()
                    });
                };
                r.readAsDataURL(input.files[0]);
            }
        }

        function loadVideos(list) {
            const c = document.getElementById('vid-cont');
            c.innerHTML = "";
            list.forEach(url => {
                c.innerHTML += `<div class="video-card"><video controls playsinline preload="metadata"><source src="${url}" type="video/mp4"></video></div>`;
            });
        }

        function updatePFP(i) {
            if (i.files[0]) {
                const r = new FileReader();
                r.onload = e => document.getElementById('my-pfp').src = e.target.result;
                r.readAsDataURL(i.files[0]);
            }
        }

        function verifyAge() {
            const day = document.getElementById('birth-day').value;
            const month = document.getElementById('birth-month').value;
            const year = document.getElementById('birth-year').value;
            const birth = new Date(year, month, day);
            const today = new Date();
            let age = today.getFullYear() - birth.getFullYear();
            if (today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) age--;
            if (age >= 18) {
                hideAll();
                const v18 = ["https://files.catbox.moe/adx7yg.mp4", "https://files.catbox.moe/1ye1zy.mp4", "https://files.catbox.moe/3cb4y4.mp4", "https://files.catbox.moe/28zl96.mp4", "https://files.catbox.moe/nq1wo9.mp4", "https://files.catbox.moe/vuinlq.mp4", "https://files.catbox.moe/ostld5.mp4", "https://files.catbox.moe/cfg2xe.mp4", "https://files.catbox.moe/m5zmyx.mp4", "https://files.catbox.moe/rtzi8d.mp4", "https://files.catbox.moe/qk44pb.mp4", "https://files.catbox.moe/ndrpr3.mp4", "https://files.catbox.moe/zls1hs.mp4", "https://files.catbox.moe/6vi78s.mp4", "https://files.catbox.moe/noyu4h.mp4", "https://files.catbox.moe/8wa3he.mp4", "https://files.catbox.moe/vpp59m.mp4"];
                loadVideos(v18);
            } else { alert("Menor de edad."); location.reload(); }
        }
    </script>
</body>
</html>
